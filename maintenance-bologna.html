<!doctype html>
<html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freya Travel · Reparació de Bolonya</title>
<style>body{font:16px system-ui;background:#f7f5fb;color:#272132;max-width:620px;margin:35px auto;padding:16px}main{background:white;border-radius:20px;padding:25px}button{padding:13px;border:0;border-radius:10px;background:#6750a4;color:white;font-weight:bold;margin:8px 8px 8px 0}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#eee8f4;padding:15px;border-radius:12px}.warn{color:#9d321c}</style></head>
<body><main><h1>Freya Travel · Bolonya</h1><p>Reparació puntual de dues ubicacions falses. No canvia visites, horaris ni reserves.</p>
<p class="warn">Pàgina de manteniment temporal. Cal tenir la sessió de Freya Travel iniciada en aquest mateix navegador.</p>
<button id="preview">1. Simular</button><button id="apply" disabled>2. Confirmar correcció</button><pre id="result" role="status">Pendent de simulació.</pre></main>
<script src="./vendor/supabase.js"></script>
<script type="module">
import {repairBolognaPoints} from './scripts/repair-bologna-location-points.mjs';
const result=document.querySelector('#result'),preview=document.querySelector('#preview'),apply=document.querySelector('#apply');
let client=null;
function output(message){result.textContent=message}
async function authenticatedClient(){
  if(!window.supabase?.createClient)throw Error('No s’ha carregat Supabase.');
  // Uses the same public configuration and default auth storage key as Freya Travel.
  // Requires SAME ORIGIN, not merely a branch preview on another domain.
  const db=window.supabase.createClient('https://otueskpksylzvkhldoft.supabase.co','sb_publishable_7h0TSVy6-7FizgVZe2iYow_IOl1luOF');
  const {data,error}=await db.auth.getUser();
  if(error||!data?.user)throw Error('Inicia sessió a Freya Travel en aquest mateix domini.');
  return db;
}
preview.addEventListener('click',async()=>{
  apply.disabled=true;preview.disabled=true;
  try{client=await authenticatedClient();const response=await repairBolognaPoints(client,{dryRun:true});
    output(JSON.stringify(response,null,2));apply.disabled=false;
  }catch(e){output('Error: '+e.message)}finally{preview.disabled=false}
});
apply.addEventListener('click',async()=>{
  if(!client||!confirm('Confirma eliminar exclusivament els dos punts falsos de Bolonya?'))return;
  apply.disabled=true;preview.disabled=true;
  try{output(JSON.stringify(await repairBolognaPoints(client,{dryRun:false}),null,2))}
  catch(e){output('Error: '+e.message)}finally{preview.disabled=false}
});
</script></body></html>
