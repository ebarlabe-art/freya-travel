name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run prebuild
      - name: CI registry fallback contracts
        run: node --test scripts/ci-postgres.test.mjs
      - name: A2 focused tests
        run: node --test scripts/import-proposal.test.mjs scripts/import-text-extractor.test.mjs scripts/import-reservation.test.mjs scripts/import-reservation-ui.test.mjs scripts/import-itinerary-review-ui.test.mjs scripts/home-entry.test.mjs scripts/travel-builder.test.mjs scripts/itinerary-place-enrichment.test.mjs scripts/itinerary-auto-place.test.mjs
      - name: Offline V2 focused tests
        run: node --test scripts/offline-v2-readonly.test.mjs
      - name: Verify previous public frontend can be rebuilt for rollback
        run: |
          git fetch --no-tags --depth=1 origin d7fee2f307b80bc621392465da67b6a5a6a6a182
          mkdir -p "$RUNNER_TEMP/freya-public-rollback"
          git archive d7fee2f307b80bc621392465da67b6a5a6a6a182 | tar -x -C "$RUNNER_TEMP/freya-public-rollback"
          cd "$RUNNER_TEMP/freya-public-rollback"
          npm ci
          npm run build
          npm run entries:check
          test -s dist/index.html
          test -s dist/sw.js
          cmp dist/index.html dist/404.html
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://abcdefghijklmnopqrst.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_validation_fixture

      - name: Verify public release targets and packaged files
        run: node scripts/check-v27-production.mjs
      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/travel-book-browser" --no-package-lock --ignore-scripts playwright-core@1.63.0
          node "$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/cli.js" install --with-deps chromium webkit
      - name: PWA bootstrap recovery contracts
        run: node --test scripts/pwa-bootstrap.test.mjs scripts/offline-v2-readonly.test.mjs
      - name: PWA bootstrap Chromium real build
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-pwa-bootstrap-browser.mjs
      - name: PWA bootstrap WebKit real build
        run: PWA_ENGINE=webkit PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-pwa-bootstrap-browser.mjs
      - name: Cultural guide and shared Catalan narration contracts
        run: node --test scripts/cultural-guide.test.mjs scripts/catalan-narration.test.mjs
      - name: Cultural guide Chromium mobile
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-cultural-guide-browser.mjs
      - name: Cultural guide tablet with desktop identification
        run: CULTURE_TABLET=1 PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-cultural-guide-browser.mjs
      - name: Cultural guide WebKit mobile
        run: CULTURE_ENGINE=webkit PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-cultural-guide-browser.mjs
      - name: Unified activities contracts
        run: node --test scripts/activities-projection.test.mjs
      - name: Unified activities Chromium mobile
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-activities-projection-browser.mjs
      - name: Unified activities tablet with desktop identification
        run: ACTIVITIES_TABLET=1 PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-activities-projection-browser.mjs
      - name: Unified activities WebKit mobile
        run: ACTIVITIES_ENGINE=webkit PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-activities-projection-browser.mjs
      - name: Itinerary partial loading and duplicate contracts
        run: node --test scripts/itinerary-loading.test.mjs scripts/trip-home.test.mjs scripts/import-itinerary-write.test.mjs
      - name: Itinerary partial loading mobile and PWA regression
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-itinerary-loading-browser.mjs
      - name: Itinerary partial loading tablet with desktop identification
        run: ITINERARY_TABLET=1 PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-itinerary-loading-browser.mjs
      - name: Itinerary routes mobile and PWA regression
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-itinerary-route-browser.mjs
      - name: V27 location, PDF and route contracts
        run: node --test scripts/place-resolution.test.mjs scripts/place-resolution-rpc.test.mjs scripts/itinerary-auto-place.test.mjs scripts/itinerary-route.test.mjs scripts/import-itinerary-pdf.test.mjs scripts/itinerary-quick-place.test.mjs
      - name: V27 automatic locations Chromium
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-automatic-places-browser.mjs
      - name: V27 automatic locations WebKit
        run: ROUTE_ENGINE=webkit PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-automatic-places-browser.mjs
      - name: Ordered activity point contracts
        run: node --test scripts/itinerary-place-points.test.mjs
      - name: Ordered activity points Chromium mobile
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-itinerary-points-browser.mjs
      - name: Ordered activity points WebKit mobile
        run: ROUTE_ENGINE=webkit PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-itinerary-points-browser.mjs
      - name: Import exclusion real mobile click Chromium
        run: IMPORT_ENGINE=chromium PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-import-exclude-browser.mjs
      - name: Import exclusion real mobile click WebKit
        run: IMPORT_ENGINE=webkit PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-import-exclude-browser.mjs
      - name: V27 routes WebKit
        run: ROUTE_ENGINE=webkit PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-itinerary-route-browser.mjs
      - name: Install isolated embedded Postgres test tooling
        run: npm install --prefix "$RUNNER_TEMP/v27-db" --no-package-lock --ignore-scripts @electric-sql/pglite@0.3.14
      - name: V27 geography migration and permissions
        run: PGLITE_MODULE="$RUNNER_TEMP/v27-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-itinerary-location-db.mjs
      - name: Ordered points migration RLS and concurrency
        run: PGLITE_MODULE="$RUNNER_TEMP/v27-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-itinerary-points-db.mjs
      - name: Cultural guide RLS identity and concurrency
        run: PGLITE_MODULE="$RUNNER_TEMP/v27-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/test-cultural-guide-db.mjs
      - name: Shared trip mobile and PWA regression
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-shared-trip-browser.mjs
      - name: Travel Book real Pages build browser regression
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-travel-book-runtime-browser.mjs

  legacy-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run prebuild
      - name: Legacy regression suite (informational)
        run: npm test

  alb03-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FREYA_CI_POSTGRES_CONTAINER: freya_alb03_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - name: Production PDF import and place resolver typechecks
        run: |
          deno check supabase/functions/cultural-guide/index.ts
          deno check supabase/functions/import-itinerary/index.ts
          deno check --config supabase/functions/place-resolution/deno.json supabase/functions/place-resolution/index.ts
      - name: Itinerary routing domain and HTTP contracts
        run: node --test scripts/itinerary-route.test.mjs
      - name: Itinerary route Edge Function typecheck
        run: deno check --config supabase/functions/itinerary-route/deno.json supabase/functions/itinerary-route/index.ts
      - run: npm run test:alb03
      - run: npm run test:alb03:image
      - run: deno check --config supabase/functions/travel-book-ingest/deno.json supabase/functions/travel-book-ingest/index.ts
      - name: Start isolated ALB-03 database just in time
        run: bash scripts/ci-postgres.sh start freya_alb03_ci
      - name: ALB-03 database contracts
        run: bash scripts/ci-postgres.sh check freya_alb03_ci && npm run test:alb03:db -- --ci-container
      - run: npm run entries:check
      - name: Diagnose ALB-03 database on failure
        if: failure()
        run: bash scripts/ci-postgres.sh diagnose freya_alb03_ci
      - name: Remove isolated ALB-03 database container
        if: always()
        run: bash scripts/ci-postgres.sh stop freya_alb03_ci

  alb02-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FREYA_CI_POSTGRES_CONTAINER: freya_alb02_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:alb02
      - name: Start isolated ALB-02 database just in time
        run: bash scripts/ci-postgres.sh start freya_alb02_ci
      - name: ALB-02 database contracts
        run: bash scripts/ci-postgres.sh check freya_alb02_ci && npm run test:alb02:db -- --ci-container
      - run: npm run entries:check
      - name: Diagnose ALB-02 database on failure
        if: failure()
        run: bash scripts/ci-postgres.sh diagnose freya_alb02_ci
      - name: Remove isolated ALB-02 database container
        if: always()
        run: bash scripts/ci-postgres.sh stop freya_alb02_ci

  shared-trip-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/shared-trip.test.mjs scripts/home-entry.test.mjs
      - run: bash scripts/ci-postgres.sh start freya_shared_trip_ci
      - name: Creation, invitation, RLS and concurrent agenda edits
        run: node scripts/test-shared-trip-db.mjs --ci-container
      - name: Diagnose isolated database on failure
        if: failure()
        run: bash scripts/ci-postgres.sh diagnose freya_shared_trip_ci
      - name: Remove isolated database
        if: always()
        run: bash scripts/ci-postgres.sh stop freya_shared_trip_ci
