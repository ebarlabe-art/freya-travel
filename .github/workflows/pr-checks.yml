name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - name: A2 focused tests
        run: node --test scripts/import-proposal.test.mjs scripts/import-text-extractor.test.mjs scripts/import-itinerary-proposal.test.mjs scripts/import-itinerary-text-extractor.test.mjs scripts/import-itinerary-pdf.test.mjs scripts/import-itinerary-review.test.mjs scripts/import-itinerary-review-ui.test.mjs scripts/configure-pages-backend.test.mjs scripts/import-reservation.test.mjs scripts/import-reservation-ui.test.mjs
      - name: Offline V2 focused tests
        run: node --test scripts/offline-v2-readonly.test.mjs
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/travel-book-browser" --no-package-lock --ignore-scripts playwright-core@1.63.0
          node "$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Travel Book real Pages build browser regression
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-travel-book-runtime-browser.mjs
      - name: Build isolated Freya PROVES and reject production URLs
        env:
          FREYA_BACKEND_ENV: staging
          FREYA_STAGING_SUPABASE_URL: https://waatqrqyddurultrazbn.supabase.co
          FREYA_STAGING_SUPABASE_PUBLISHABLE_KEY: sb_publishable_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          RAILWAY_ENVIRONMENT_NAME: preview
        run: |
          npm run build
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const html=readFileSync("dist/index.html","utf8");
            const fallback=readFileSync("dist/404.html","utf8");
            assert.equal(html,fallback);
            assert.ok(html.includes("waatqrqyddurultrazbn.supabase.co"));
            assert.ok(!html.includes("otueskpksylzvkhldoft"));
            assert.ok(html.includes("id=\\"freya-staging-marker\\""));
            assert.ok(html.includes("Freya PROVES"));
            console.log("PASS isolated Freya PROVES build and fallback parity");
          '

  legacy-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - name: Legacy regression suite (informational)
        run: npm test

  alb03-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FREYA_CI_POSTGRES_CONTAINER: freya_alb03_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm run test:alb03
      - run: npm run test:alb03:image
      - name: A2 itinerary function type check
        run: deno check supabase/functions/import-itinerary/index.ts
      - run: deno check --config supabase/functions/travel-book-ingest/deno.json supabase/functions/travel-book-ingest/index.ts
      - name: Start isolated ALB-03 database just in time
        run: bash scripts/ci-postgres.sh start freya_alb03_ci
      - name: ALB-03 database contracts
        run: bash scripts/ci-postgres.sh check freya_alb03_ci && npm run test:alb03:db -- --ci-container
      - run: npm run entries:check
      - name: Diagnose ALB-03 database on failure
        if: failure()
        run: bash scripts/ci-postgres.sh diagnose freya_alb03_ci
      - name: Remove isolated ALB-03 database container
        if: always()
        run: bash scripts/ci-postgres.sh stop freya_alb03_ci

  alb02-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FREYA_CI_POSTGRES_CONTAINER: freya_alb02_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:alb02
      - name: Start isolated ALB-02 database just in time
        run: bash scripts/ci-postgres.sh start freya_alb02_ci
      - name: ALB-02 database contracts
        run: bash scripts/ci-postgres.sh check freya_alb02_ci && npm run test:alb02:db -- --ci-container
      - run: npm run entries:check
      - name: Diagnose ALB-02 database on failure
        if: failure()
        run: bash scripts/ci-postgres.sh diagnose freya_alb02_ci
      - name: Remove isolated ALB-02 database container
        if: always()
        run: bash scripts/ci-postgres.sh stop freya_alb02_ci
