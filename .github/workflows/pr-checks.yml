name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a2-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - name: A2 focused tests
        run: node --test scripts/import-proposal.test.mjs scripts/import-text-extractor.test.mjs scripts/import-reservation.test.mjs scripts/import-reservation-ui.test.mjs
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  legacy-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - name: Legacy regression suite (informational)
        run: npm test

  alb03-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated ALB-03 database (no remote credentials)
        run: |
          docker run -d --name freya_alb02_ci -e POSTGRES_PASSWORD=local-alb02-test-only public.ecr.aws/supabase/postgres:17.6.1.165
          for attempt in $(seq 1 60); do
            if docker exec freya_alb02_ci pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec freya_alb02_ci pg_isready -U postgres
          docker exec -i freya_alb02_ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
          END $$;
          SQL
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm run test:alb03
      - run: npm run test:alb03:image
      - run: deno check --config supabase/functions/travel-book-ingest/deno.json supabase/functions/travel-book-ingest/index.ts
      - run: npm run test:alb03:db -- --ci-container
      - run: npm run entries:check
      - name: Remove isolated database container
        if: always()
        run: docker rm -f freya_alb02_ci

  alb02-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated ALB-02 database (no remote credentials)
        run: |
          docker run -d --name freya_alb02_ci -e POSTGRES_PASSWORD=local-alb02-test-only public.ecr.aws/supabase/postgres:17.6.1.165
          for attempt in $(seq 1 60); do
            if docker exec freya_alb02_ci pg_isready -U postgres; then break; fi
            sleep 1
          done
          docker exec freya_alb02_ci pg_isready -U postgres
          docker exec -i freya_alb02_ci psql -U postgres -v ON_ERROR_STOP=1 <<'SQL'
          DO $$ BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='anon') THEN CREATE ROLE anon NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated') THEN CREATE ROLE authenticated NOLOGIN; END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role') THEN CREATE ROLE service_role NOLOGIN BYPASSRLS; END IF;
          END $$;
          SQL
      - run: npm run test:alb02
      - run: npm run test:alb02:db -- --ci-container
      - run: npm run entries:check
      - name: Remove isolated database container
        if: always()
        run: docker rm -f freya_alb02_ci
