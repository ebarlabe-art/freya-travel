name: PR checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-past-records-once:
    if: github.head_ref == 'nav/tools-taxonomy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nav/tools-taxonomy
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply canonical past-trip Records architecture
        run: node scripts/apply-past-records-architecture.mjs
      - name: Validate focused regression
        run: |
          node --test scripts/past-records-navigation.test.mjs
          npm run entries:check
      - name: Restore normal CI and commit product changes
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/pr-checks.yml
          git rm -f scripts/apply-past-records-architecture.mjs
          git rm -f .github/workflows/apply-past-records.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html 404.html docs/ROADMAP-CANONIC.md scripts/past-records-navigation.test.mjs .github/workflows/pr-checks.yml
          git commit -m "Make Records the home of past trips"
          git push origin HEAD:nav/tools-taxonomy

  a2-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - name: A2 focused tests
        run: node --test scripts/import-proposal.test.mjs scripts/import-text-extractor.test.mjs scripts/import-reservation.test.mjs scripts/import-reservation-ui.test.mjs
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Install isolated browser test tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/travel-book-browser" --no-package-lock --ignore-scripts playwright-core@1.63.0
          node "$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/cli.js" install --with-deps chromium
      - name: Travel Book real Pages build browser regression
        run: PLAYWRIGHT_MODULE="$RUNNER_TEMP/travel-book-browser/node_modules/playwright-core/index.mjs" node scripts/check-travel-book-runtime-browser.mjs

  legacy-suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prebuild
      - name: Legacy regression suite (informational)
        run: npm test

  alb03-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FREYA_CI_POSTGRES_CONTAINER: freya_alb03_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - run: npm run test:alb03
      - run: npm run test:alb03:image
      - run: deno check --config supabase/functions/travel-book-ingest/deno.json supabase/functions/travel-book-ingest/index.ts
      - name: Start isolated ALB-03 database just in time
        run: bash scripts/ci-postgres.sh start freya_alb03_ci
      - name: ALB-03 database contracts
        run: bash scripts/ci-postgres.sh check freya_alb03_ci && npm run test:alb03:db -- --ci-container
      - run: npm run entries:check
      - name: Diagnose ALB-03 database on failure
        if: failure()
        run: bash scripts/ci-postgres.sh diagnose freya_alb03_ci
      - name: Remove isolated ALB-03 database container
        if: always()
        run: bash scripts/ci-postgres.sh stop freya_alb03_ci

  alb02-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FREYA_CI_POSTGRES_CONTAINER: freya_alb02_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:alb02
      - name: Start isolated ALB-02 database just in time
        run: bash scripts/ci-postgres.sh start freya_alb02_ci
      - name: ALB-02 database contracts
        run: bash scripts/ci-postgres.sh check freya_alb02_ci && npm run test:alb02:db -- --ci-container
      - run: npm run entries:check
      - name: Diagnose ALB-02 database on failure
        if: failure()
        run: bash scripts/ci-postgres.sh diagnose freya_alb02_ci
      - name: Remove isolated ALB-02 database container
        if: always()
        run: bash scripts/ci-postgres.sh stop freya_alb02_ci
