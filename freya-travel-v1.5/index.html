<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6750a4">
  <meta name="referrer" content="no-referrer">
  <link rel="manifest" href="/freya-travel/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/freya-travel/icons/icon-192.png">
  <title>Freya Travel</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#f7f5fb;color:#1f1b24;margin:0;padding:24px}
    main{max-width:36rem;margin:12vh auto}a{display:inline-block;padding:16px;background:#6750a4;color:white;border-radius:14px;text-decoration:none}
  </style>
</head>
<body>
  <main><h1>Freya Travel</h1><p>Obrint l’entrada principal…</p>
    <a id="continueLink" href="/freya-travel/">Continuar a Freya Travel</a>
    <noscript><p>Activa JavaScript per utilitzar l’app. Si aquest enllaç era de recuperació d’accés, torna’l a obrir amb JavaScript activat.</p></noscript>
  </main>
  <script>
    // Compatibility entry only. Never initialize auth, application state or a SW here.
    // Fixed same-origin destination: query values cannot choose a redirect target.
    const destination = new URL('/freya-travel/', window.location.origin);
    destination.search = window.location.search;
    destination.hash = window.location.hash;
    document.getElementById('continueLink').href = destination.href;
    window.location.replace(destination.href);
  </script>
</body>
</html>
